# Installed to /etc/systemd/system.conf.d/99-firepit-watchdog.conf
# BCM hardware watchdog: if systemd/kernel wedges (total Pi freeze), the SoC
# watchdog resets the Pi. On reboot the GPIOs return to the safe boot state
# (see the gpio= line in config.txt), so gas ends up OFF.
#
# Requires /dev/watchdog, enabled by "dtparam=watchdog=on" in config.txt (needs a reboot).
[Manager]
RuntimeWatchdogSec=15
RebootWatchdogSec=2min
